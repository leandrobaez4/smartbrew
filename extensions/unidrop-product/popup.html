<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SmartBrew · Unidrop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Extraer producto de Unidrop</h1>
  <p>Abrí una ficha del catálogo de Unidrop y extraé el producto para conectarlo con SmartBrew.</p>
  <button id="extract" type="button">Extraer este producto</button>
  <p id="status" role="status" aria-live="polite">Todavía no se extrajeron datos.</p>
  <div id="variant-field" class="hidden">
    <label for="variant">Variante / SKU</label>
    <select id="variant"></select>
  </div>
  <label for="result">Datos preparados</label>
  <textarea id="result" rows="12" readonly placeholder="El JSON aparecerá aquí"></textarea>
  <button id="copy" class="secondary" type="button" disabled>Copiar JSON</button>
  <button id="send" class="success" type="button" disabled>Configurar en SmartBrew</button>
  <p class="note">La extensión sólo lee la ficha visible. Las compras y publicaciones continúan siendo manuales.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
